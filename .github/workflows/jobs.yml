name: Multi Job Demonstration

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build steps
        run: echo "Building The Application..."

  test:
    name: Run test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test steps
        run: echo "Running Test"

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy step
        run: echo "Deploying to staging..."
